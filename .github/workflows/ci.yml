name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Azure project structure
        run: npm run azure:validate
      - name: Lint Bicep
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --outfile /tmp/foundry-main.json
      - name: Test
        run: npm test
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
