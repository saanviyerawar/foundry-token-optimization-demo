# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: foundry-agent-optimization-demo
metadata:
  template: foundry-agent-optimization-demo@1.0.0
infra:
  provider: bicep
  path: infra
